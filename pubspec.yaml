name: ipo_allotment_tracker
description: A polished Flutter IPO discovery and allotment tracking frontend.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  get_storage: ^2.1.1
  flutter_secure_storage: 
  file_picker: ^10.3.10
  share_plus: ^11.1.0
  cross_file: ^0.3.5+2
  flutter_local_notifications: 18.0.1
  flutter_notification_listener_plus: 1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: assets/icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon.png

flutter:
  uses-material-design: true
